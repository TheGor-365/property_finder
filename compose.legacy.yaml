name: property-finder-legacy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pf_legacy
      POSTGRES_PASSWORD: ${PF_LEGACY_DB_PASSWORD:?Missing password}
      POSTGRES_DB: property_finder_legacy_development
    volumes:
      - pf_legacy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pf_legacy -d property_finder_legacy_development"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"

volumes:
  pf_legacy_pg_data:
