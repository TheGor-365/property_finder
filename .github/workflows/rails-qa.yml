name: Rails QA

on:
  pull_request:
    branches:
      - master
      - work/property-finder-upgrade-lab
  push:
    branches:
      - work/property-finder-ui-content
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RAILS_ENV: test
      PF_DEV_DB_PASSWORD: ci-property-finder-only
      RAILS_MAX_THREADS: "5"
      BUNDLE_WITHOUT: development

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: property_finder_test
          POSTGRES_USER: first
          POSTGRES_PASSWORD: ci-property-finder-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U first -d property_finder_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev imagemagick
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.12"
          bundler: "2.6.9"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - name: Install JS dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile
      - name: Prepare isolated test database
        run: bundle exec rails db:prepare
      - name: Rails integration and unit tests (random and regression seed)
        run: |
          bundle exec rails test test
          bundle exec rails test test --seed 34035
      - name: Demo content creation is safe and idempotent
        run: |
          first="$(bundle exec rails pf:demo:articles)"
          printf '%s\n' "$first"
          printf '%s\n' "$first" | grep -q '^PF_DEMO_ARTICLES_CREATED=6

          second="$(bundle exec rails pf:demo:articles)"
          printf '%s\n' "$second"
          printf '%s\n' "$second" | grep -q '^PF_DEMO_ARTICLES_CREATED=0

          bundle exec rails runner 'abort "Expected 6 DEMO articles" unless Post.where("url LIKE ?", "pf-demo-%").count == 6'
      - name: Precompile assets
        run: bundle exec rails assets:precompile

  production_image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image without secrets
        run: docker build --file Dockerfile --tag property-finder:release-check .
      - name: Missing production configuration must refuse startup
        run: |
          result=0
          docker run --rm property-finder:release-check > /tmp/pf-release-guard.log 2>&1 || result=$?
          test "$result" -eq 78
          grep -q 'STARTUP_BLOCKED: missing required variable DATABASE_URL' /tmp/pf-release-guard.log
